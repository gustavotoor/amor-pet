<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Amor Pet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="container">
    <div class="auth-container">
      <div class="auth-header text-center">
        <a href="index.html">
          <img src="images/logo.svg" alt="Amor Pet" class="auth-logo">
        </a>
        <h1>Entrar na sua conta</h1>
      </div>
      
      <div class="auth-form">
        <form id="loginForm">
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail" required>
          </div>
          
          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <div class="input-group">
              <input type="password" class="form-control" id="senha" placeholder="Digite sua senha" required>
              <button class="btn btn-outline-secondary toggle-password" type="button">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          
          <div class="mb-4 d-flex justify-content-between align-items-center">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="lembrar">
              <label class="form-check-label" for="lembrar">Lembrar-me</label>
            </div>
            <a href="recuperar-senha.html" class="forgot-password">Esqueci minha senha</a>
          </div>
          
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
        
        <div class="separator">
          <span>ou</span>
        </div>
        
        <button class="btn btn-outline-secondary w-100 google-btn">
          <img src="images/google-icon.svg" alt="Google" width="20" height="20">
          Entrar com Google
        </button>
        
        <div class="auth-footer text-center mt-4">
          <p>Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Mostrar/ocultar senha
    document.querySelectorAll('.toggle-password').forEach(button => {
      button.addEventListener('click', function() {
        const input = this.previousElementSibling;
        const icon = this.querySelector('i');
        
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.remove('fa-eye');
          icon.classList.add('fa-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.remove('fa-eye-slash');
          icon.classList.add('fa-eye');
        }
      });
    });
    
    // Validação do formulário
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Simulação de login bem-sucedido
      // Em um ambiente real, aqui seria feita a requisição para o backend
      const email = document.getElementById('email').value;
      
      if (email === 'admin@amorpet.com') {
        window.location.href = 'admin/dashboard.html';
      } else {
        window.location.href = 'tutor/dashboard.html';
      }
    });
  </script>
</body>
</html>
