<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Amor Pet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="container">
    <div class="auth-container">
      <div class="auth-header text-center">
        <a href="index.html">
          <img src="images/logo.svg" alt="Amor Pet" class="auth-logo">
        </a>
        <h1>Criar sua conta</h1>
      </div>
      
      <div class="auth-form">
        <form id="cadastroForm">
          <div class="mb-3">
            <label for="nome" class="form-label">Nome completo</label>
            <input type="text" class="form-control" id="nome" placeholder="Digite seu nome completo" required>
          </div>
          
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail" required>
          </div>
          
          <div class="mb-3">
            <label for="telefone" class="form-label">Telefone</label>
            <input type="tel" class="form-control" id="telefone" placeholder="(00) 00000-0000">
          </div>
          
          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <div class="input-group">
              <input type="password" class="form-control" id="senha" placeholder="Digite sua senha" required>
              <button class="btn btn-outline-secondary toggle-password" type="button">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="form-text">A senha deve ter pelo menos 8 caracteres.</div>
          </div>
          
          <div class="mb-3">
            <label for="confirmarSenha" class="form-label">Confirmar senha</label>
            <div class="input-group">
              <input type="password" class="form-control" id="confirmarSenha" placeholder="Confirme sua senha" required>
              <button class="btn btn-outline-secondary toggle-password" type="button">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          
          <div class="mb-4 form-check">
            <input type="checkbox" class="form-check-input" id="termos" required>
            <label class="form-check-label" for="termos">Aceito os <a href="#">termos de uso</a> e <a href="#">política de privacidade</a></label>
          </div>
          
          <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
        </form>
        
        <div class="separator">
          <span>ou</span>
        </div>
        
        <button class="btn btn-outline-secondary w-100 google-btn">
          <img src="images/google-icon.svg" alt="Google" width="20" height="20">
          Cadastrar com Google
        </button>
        
        <div class="auth-footer text-center mt-4">
          <p>Já tem uma conta? <a href="login.html">Entrar</a></p>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Mostrar/ocultar senha
    document.querySelectorAll('.toggle-password').forEach(button => {
      button.addEventListener('click', function() {
        const input = this.previousElementSibling;
        const icon = this.querySelector('i');
        
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.remove('fa-eye');
          icon.classList.add('fa-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.remove('fa-eye-slash');
          icon.classList.add('fa-eye');
        }
      });
    });
    
    // Validação do formulário
    document.getElementById('cadastroForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const senha = document.getElementById('senha').value;
      const confirmarSenha = document.getElementById('confirmarSenha').value;
      
      if (senha.length < 8) {
        alert('A senha deve ter pelo menos 8 caracteres.');
        return;
      }
      
      if (senha !== confirmarSenha) {
        alert('As senhas não coincidem.');
        return;
      }
      
      // Simulação de cadastro bem-sucedido
      alert('Cadastro realizado com sucesso! Você será redirecionado para a página de login.');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
